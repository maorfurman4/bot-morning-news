name: Daily Morning Briefing Analyst

on:
  # ההפעלה הרגילה: Vercel Cron ביוסי (bot-task-calendar/vercel.json) קורא ל-workflow_dispatch כל בוקר
  # ב-06:00–06:59 (חורף) / 07:00–07:59 (קיץ). ה-schedule כאן רק גיבוי — GitHub מאחר אותו ב-3–6 שעות
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch: # מאפשר לך להריץ ידנית בלחיצת כפתור
    inputs:
      dry_run:
        description: "תצוגה מקדימה — מדפיס ללוג, לא שולח לטלגרם"
        type: boolean
        default: false
      ai_models:
        description: "TEST ONLY: OpenAI models, comma separated (empty = the bot's default)"
        type: string
        default: ""
      test_topics:
        description: "בדיקה בפרטי: רק הנושאים האלה (למשל sport,ent), נשלח רק אליך — לא לערוץ"
        type: string
        default: ""

permissions:
  contents: write  # שמירת schedule.json (לוח השידורים של היום — כדי לדעת מחר מה שודר "אמש")
  actions: read

jobs:
  run-analyst-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Skip if today's brief was already sent
      # רק בגיבוי המתוזמן: אם הבריף כבר נשלח היום (ע"י Vercel) — לא שולחים פעמיים
      if: github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sent=$(gh run list -R "$GITHUB_REPOSITORY" --workflow main.yml --status success \
               --created ">=$(date -u +%F)" --json databaseId -q length)
        echo "already sent today: $sent"
        if [ "$sent" -gt 0 ]; then echo "SKIP=1" >> "$GITHUB_ENV"; fi

    - name: Checkout repository
      if: env.SKIP != '1'
      uses: actions/checkout@v3

    - name: Set up Python
      if: env.SKIP != '1'
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      if: env.SKIP != '1'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Analyst Agent
      if: env.SKIP != '1'
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        AI_MODELS: ${{ inputs.ai_models }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # מגיה לשוני; בלעדיו הבריף יוצא בלי הגהה
        TELEGRAM_TOKEN_NEWS: ${{ secrets.TELEGRAM_TOKEN_NEWS }}
        CHAT_ID_NEWS: ${{ secrets.CHAT_ID_NEWS }}
        NEWS_CHANNEL_ID: ${{ secrets.NEWS_CHANNEL_ID }}
      run: python bot.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.test_topics && format('--only={0}', inputs.test_topics) || '' }}

    - name: Save today's TV schedule
      # ה-API של yes נותן רק מהיום והלאה — שומרים את הלוח של היום, ומחר בבוקר הוא "אמש"
      if: env.SKIP != '1'
      run: |
        [ -f schedule.json ] || exit 0
        git config user.name "news-bot"
        git config user.email "news-bot@users.noreply.github.com"
        git add schedule.json reported.json 2>/dev/null || git add schedule.json
        git diff --cached --quiet && exit 0
        git commit -m "chore: TV schedule $(date -u +%F)"
        git pull --rebase -q && git push
